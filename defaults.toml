dockerfile = '''
# Generated by tmpf.
#
# Build
#   docker build -t my-linux .
#
# Run
#   docker run --rm -it my-linux
#
# Mount workspace and publish port 8080
#   docker run --rm -it -v "$(pwd):/workspace" -p 8080:8080 my-linux

ARG UBUNTU_VERSION=24.04
FROM ubuntu:${UBUNTU_VERSION}

RUN apt-get update \
    && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
        ca-certificates \
        curl \
        git \
        iproute2 \
        iputils-ping \
        less \
        vim-tiny \
    && rm -rf /var/lib/apt/lists/*

RUN useradd --create-home --user-group --shell /bin/bash user \
    && mkdir -p /workspace \
    && chown user:user /workspace

WORKDIR /workspace

# COPY --chown=user:user ./scripts/ /workspace/scripts/
# COPY --chown=user:user ./config.txt /workspace/config.txt

USER user

# EXPOSE 8080
# VOLUME ["/workspace/data"]

CMD ["/bin/bash"]
'''

compose = '''
# Generated by tmpf.
#
# Start
#   docker compose up -d --build
# Enter
#   docker compose exec linux bash
# Stop
#   docker compose down

name: my-linux

services:
  linux:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UBUNTU_VERSION: "24.04"
    image: my-linux:local
    working_dir: /workspace
    environment:
      LANG: C.UTF-8
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - .:/workspace
      - home:/home/user
    networks:
      - devnet
    stdin_open: true
    tty: true
    command: ["/bin/bash"]
    restart: "no"

volumes:
  home:

networks:
  devnet:
    driver: bridge
'''

makefile = '''
# Generated by tmpf.
# make | make run | make clean

.DEFAULT_GOAL := all

CXX := g++
CPPFLAGS := -Iinclude
CXXFLAGS := -std=c++17 -Wall -Wextra -O2
LDFLAGS :=
LDLIBS :=

TARGET := app
BUILD_DIR := build
SOURCES := main.cpp
OBJECTS := $(SOURCES:%.cpp=$(BUILD_DIR)/%.o)

.PHONY: all run clean

all: $(TARGET)

$(TARGET): $(OBJECTS)
	$(CXX) $(CXXFLAGS) $(LDFLAGS) -o $@ $^ $(LDLIBS)

$(BUILD_DIR)/%.o: %.cpp
	mkdir -p $(@D)
	$(CXX) $(CPPFLAGS) $(CXXFLAGS) -MMD -MP -c $< -o $@

run: $(TARGET)
	./$(TARGET)

clean:
	$(RM) -r $(BUILD_DIR) $(TARGET)

-include $(OBJECTS:.o=.d)
'''

cmake = '''
# Generated by tmpf.
#
# Configure
#   cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
# Build
#   cmake --build build
# Run
#   ./build/app

cmake_minimum_required(VERSION 3.16)

project(my_project VERSION 0.1.0 LANGUAGES CXX)

add_executable(app
    main.cpp
)

target_compile_features(app PRIVATE cxx_std_17)
set_target_properties(app PROPERTIES CXX_EXTENSIONS OFF)

target_include_directories(app PRIVATE
    "${CMAKE_CURRENT_SOURCE_DIR}/include"
)

if(MSVC)
    target_compile_options(app PRIVATE /W4)
else()
    target_compile_options(app PRIVATE -Wall -Wextra -Wpedantic)
endif()

# find_package(Threads REQUIRED)
# target_link_libraries(app PRIVATE Threads::Threads)

install(TARGETS app RUNTIME DESTINATION bin)
'''

